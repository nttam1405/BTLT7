<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Return first and last name from a form</title>
</head>
<body>
  <form id="form1" onsubmit="getFormvalue(event)">
    First name: <input type="text" name="fname" value="Nguyễn "><br>
    Last name: <input type="text" name="lname" value="Thanh Tâm"><br>
    <input type="submit" value="Submit">
  </form>

  <script>
    function getFormvalue(event) {
      // Ngăn form tải lại trang
      if (event) event.preventDefault();
      
      var form = document.getElementById("form1");
      var firstName = form.elements["fname"].value;
      var lastName = form.elements["lname"].value;
      
      alert("Họ và tên: " + firstName + " " + lastName);
      console.log("First name:", firstName);
      console.log("Last name:", lastName);
    }
  </script>
</body>
</html>
